services:
  - type: web
    name: climate-hazard-trend-analyzer
    runtime: python
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20
      - key: ENVIRONMENT
        value: production
      - key: OPEN_METEO_ARCHIVE_URL
        value: https://archive-api.open-meteo.com/v1/archive
      - key: OPEN_METEO_GEOCODING_URL
        value: https://geocoding-api.open-meteo.com/v1/search
